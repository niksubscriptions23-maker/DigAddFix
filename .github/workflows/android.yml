name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Policy and protocol checks
        run: python3 scripts/check_core.py
      - name: Build and lint
        run: ./gradlew --no-daemon :core:check :app:assembleDebug :app:lintDebug
      - name: Show lint results
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DigAddFix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
